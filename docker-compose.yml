# Runs the frontend and backend together.
#
# The frontend is served at BASE_PATH (default /listing-ccd) on FRONTEND_PORT
# (default 6026). The backend API is served at BASE_PATH/api on BACKEND_PORT
# (default 8081). Point your own reverse proxy (IITG-side or otherwise) at
# these two ports to publish everything under a single public host/path.
services:
  backend:
    build:
      context: ./backend
    container_name: dpr_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: ${BACKEND_PORT:-8081}
      BASE_PATH: ${BASE_PATH_NAME:-listing-ccd}
    ports:
      - "${BACKEND_PORT:-8081}:${BACKEND_PORT:-8081}"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_BASE_URL: ${BASE_PATH_NAME:-listing-ccd}/
        VITE_API_BASE_URI: ${VITE_API_BASE_URI:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    container_name: dpr_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      BASE_PATH: ${BASE_PATH_NAME:-listing-ccd}
    ports:
      - "${FRONTEND_PORT:-6026}:3000"
    depends_on:
      - backend
