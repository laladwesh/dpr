services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: ${BASE_PATH_NAME:-listing-ccd}/
        VITE_API_BASE_URI: ${VITE_API_BASE_URI:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    container_name: dpr-app
    restart: unless-stopped
    # Shares the host's network namespace, so the app is reachable directly
    # on localhost:${PORT} and can reach a host-level MongoDB at 127.0.0.1:27017.
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: ${PORT:-6026}
      BASE_PATH: /${BASE_PATH_NAME:-listing-ccd}
      FRONTEND_BASE_PATH: /${BASE_PATH_NAME:-listing-ccd}
    env_file:
      # MONGODB_URI, Azure app creds, session/admin secrets, etc.
      - ./backend/.env

  # Optional containerised Mongo, only needed if you don't already run
  # mongod on the host. Start with: docker compose --profile with-mongo up -d
  mongo:
    image: mongo:7
    container_name: dpr-mongo
    profiles: ["with-mongo"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
